name: Documentation issue
description: Report a typo, broken link, unclear explanation, or rendering problem.
title: "Docs: "
labels:
  - documentation
body:
  - type: textarea
    id: issue
    attributes:
      label: What should be improved?
      description: Describe the typo, broken link, unclear content, or rendering problem.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety check
      description: Do not include secrets, private URLs, personal data, production source code, or unsanitized screenshots.
    validations:
      required: true
